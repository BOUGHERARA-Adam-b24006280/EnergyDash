name: Deploy to AlwaysData

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.ALWAYSDATA_HOST }}
        username: ${{ secrets.ALWAYSDATA_USERNAME }}
        password : ${{ secrets.ALWAYSDATA_PASSWORD }}
        port: 22
        script: |
          # Récupère les derniers changements de la branche main
          git pull origin main
          
          # Installe/met à jour les dépendances Composer
          composer install --no-dev --optimize-autoloader --no-interaction
          
          # Vide le cache si applicable
          if [ -d "storage/cache" ]; then
          rm -rf storage/cache/*
          fi
          
          echo "Déploiement terminé avec succès !"